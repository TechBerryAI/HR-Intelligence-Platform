# Nginx server block for HR Job Portal (Ubuntu)
# Install: sudo cp deploy/nginx-hr-job-portal.conf /etc/nginx/sites-available/hr-job-portal
#         sudo ln -s /etc/nginx/sites-available/hr-job-portal /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#
# Local private network: server at 192.168.1.27. Replace path if app is elsewhere.
# For HTTPS on LAN, add ssl_certificate directives inside the server { } block.

server {
    listen 80;
    server_name 192.168.1.27;
    root /var/www/hr-job-portal/frontend/dist;
    index index.html;

    # Frontend (SPA) - try files, then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API proxy to Gunicorn
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Backend health check
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets from build (cache)
    location /assets {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
