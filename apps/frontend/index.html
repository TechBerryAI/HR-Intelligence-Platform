<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Intelligence — Next Generation HR Technology</title>
    <!--
      CSP: JWT remains in localStorage (XSS-sensitive); a tight CSP reduces that risk.
      connect-src allows same-origin (Vite /api proxy + HMR) and local Flask during split-origin dev.

      frame-ancestors is deliberately NOT here: browsers ignore it when it arrives
      via <meta>, and every page load logged a console error saying so. It is
      enforced as a real header instead — see `_security_headers` in
      apps/backend/app/bootstrap/create_app.py, which sets both
      `X-Frame-Options: DENY` and a CSP carrying `frame-ancestors 'none'`. When
      this SPA is served by a reverse proxy in production, that proxy must send
      the same two headers for the HTML document; object-src/frame-src 'none'
      below still block embedding *other* documents from here either way.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; worker-src 'self' blob:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; img-src 'self' data: blob: https:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" />
    <meta name="description" content="AI-powered workforce management for modern organizations. The future of HR technology." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/theme-init.js"></script>
  </head>
  <body class="bg-surface min-h-screen text-slate-600">
    <div id="root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
  </html>
