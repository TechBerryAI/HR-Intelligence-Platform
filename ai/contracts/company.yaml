contract:
  id: CONTRACT-COMPANY
  version: "1.0.0"
  kind: domain
  status: active
  supersedes: null
  updated_at: "2026-06-25"

purpose: >
  Organization entity for employers and clients. Appears as plain strings in TOON
  (company, experience.N.company); normalized form enables deduplication and
  knowledge/companies linking.

fields:
  name:
    type: string
    description: Display name as on resume or JD.
    toon_path: company
  canonical_id:
    type: string
    description: Stable ID from knowledge/companies.
    toon_path: null
  legal_name:
    type: string
    toon_path: null
  industry:
    type: string
    toon_path: null
  size:
    type: enum
    enum: [startup, smb, mid_market, enterprise, unknown]
    toon_path: null
  website:
    type: url
    toon_path: null
  headquarters:
    type: ref
    ref: contracts/location.yaml
    toon_path: null

required:
  - name

optional:
  - canonical_id
  - legal_name
  - industry
  - size
  - website
  - headquarters

relationships:
  - id: company-kb
    target: knowledge/companies/
    field: canonical_id
    cardinality: many_to_one
  - id: company-jd
    target: contracts/job_description.yaml
    field: company
    cardinality: one_to_many
  - id: company-experience
    target: contracts/experience.yaml
    field: company
    cardinality: one_to_many
  - id: company-project
    target: contracts/project.yaml
    field: organization
    cardinality: one_to_many

normalization_rules:
  - id: company-string-ingest
    applies_to: name
    rule: When TOON provides string, wrap as { name: string }.
    priority: 100
  - id: company-alias-resolve
    applies_to: canonical_id
    rule: Match name against knowledge/companies aliases (case-insensitive).
    priority: 80
  - id: company-suffix-strip
    applies_to: name
    rule: >
      Optional normalization strips legal suffixes (Inc., Ltd., LLC) for matching only;
      preserve original name for display.
    priority: 60

validation_notes:
  - TOON never stores company as nested object — projection collapses to string name.
  - Empty company name invalid in normalized company ref; allow null company on experience.
  - JD company field is optional in validation but used for display and search.
