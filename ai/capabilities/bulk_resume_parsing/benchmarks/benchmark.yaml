benchmark:
  capability: bulk_resume_parsing
  version: "1.0.0"
  dataset: datasets/evaluation/bulk_resume_parsing
  expected_schema: resume_v1
  success_criteria:
    - schema_validation_pass_rate >= 0.95
    - required_fields_present_rate >= 0.98
  latency_target_ms: 12000
  accuracy_target: 0.82
  future_metrics:
    - field_level_f1
    - calibration_error
    - human_review_agreement
    - cost_per_invocation
