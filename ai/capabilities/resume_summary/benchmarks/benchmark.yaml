benchmark:
  capability: resume_summary
  version: "1.0.0"
  dataset: datasets/evaluation/resume_summary
  expected_schema: resume_summary_v1
  success_criteria:
    - schema_validation_pass_rate >= 0.95
    - required_fields_present_rate >= 0.98
  latency_target_ms: 3000
  accuracy_target: 0.9
  future_metrics:
    - field_level_f1
    - calibration_error
    - human_review_agreement
    - cost_per_invocation
