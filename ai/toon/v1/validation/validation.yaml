# TOON wire-format validation rules
# HRMS production validation delegates to backend/parsing_utils.validate_toon_format.

validation:
  id: TOON-VALIDATION-v1
  version: "1.0.0"
  status: active
  updated_at: "2026-06-27"

description: >
  Schema-level TOON validation rules. Production HRMS enforces these via
  backend/parsing_utils.validate_toon_format(). Normalized schema validation
  lives in ai/schemas/validation/rules.yaml (separate concern).

hrms_delegate:
  function: backend/parsing_utils.validate_toon_format
  note: Authoritative at runtime; do not duplicate logic here.

global_rules:
  - id: root-is-dict
    severity: error
    check: is_dict
  - id: type-matches-document
    severity: error
    check: field_equals
    field: type

resume:
  document_type: resume
  rules:
    - id: resume-root-type
      severity: error
      check: field_equals
      field: type
      value: resume
    - id: resume-required-root
      severity: error
      check: keys_present
      fields: [person, skills, experience, education]
    - id: resume-person-keys
      severity: error
      check: nested_keys_present
      path: person
      fields: [name, email, phone]
    - id: resume-person-urls
      severity: error
      check: optional_string_or_null
      path: person
      fields: [linkedin, github, portfolio, website, twitter]
    - id: resume-person-other-urls
      severity: error
      check: optional_array_or_null
      path: person.otherUrls
    - id: resume-skills-array
      severity: error
      check: is_array
      field: skills
    - id: resume-experience-array
      severity: error
      check: is_array
      field: experience
    - id: resume-education-array
      severity: error
      check: is_array
      field: education

  notes:
    - No validation of non-empty values for list fields
    - No validation of nested object shapes inside experience/education

job_description:
  document_type: job_description
  rules:
    - id: jd-root-type
      severity: error
      check: field_equals
      field: type
      value: job_description
    - id: jd-required-root
      severity: error
      check: keys_present
      fields: [title, location, skills, responsibilities]
    - id: jd-skills-array
      severity: error
      check: is_array
      field: skills
    - id: jd-responsibilities-array
      severity: error
      check: is_array
      field: responsibilities

candidate:
  document_type: candidate
  projection: none
  rules: []
  notes:
    - Candidate profile is not a TOON document class
    - Validate via schemas/validation/rules.yaml for normalized form
