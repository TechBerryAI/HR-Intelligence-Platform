# Resume → TOON projection mapping
# Canonical source: ai/toon/v1/mappings/resume.yaml

mapping:
  id: MAPPING-TOON-RESUME
  version: "1.0.0"
  status: active
  updated_at: "2026-06-27"
  package: ../../
  datatypes_ref: ../vocabulary/datatypes.yaml
  normalization_ref: ../normalization/normalization.yaml
  validation_ref: ../validation/validation.yaml#resume

schema_ref: ../../../schemas/resume.yaml
toon_type: resume
type_field: resume

field_map:
  - normalized: type
    toon: type
    transform: literal
  - normalized: person.name
    toon: person.name
    transform: string
  - normalized: person.email
    toon: person.email
    transform: string
  - normalized: person.phone
    toon: person.phone
    transform: string
  - normalized: person.location
    toon: person.location
    transform: location_to_string
  - normalized: person.linkedin
    toon: person.linkedin
    transform: string_optional
  - normalized: person.github
    toon: person.github
    transform: string_optional
  - normalized: person.portfolio
    toon: person.portfolio
    transform: string_optional
  - normalized: person.website
    toon: person.website
    transform: string_optional
  - normalized: person.twitter
    toon: person.twitter
    transform: string_optional
  - normalized: person.otherUrls
    toon: person.otherUrls
    transform: string_array
  - normalized: summary
    toon: summary
    transform: string_optional
  - normalized: skills
    toon: skills
    transform: skill_array_to_strings
  - normalized: experience
    toon: experience
    transform: experience_array
    item_map:
      - normalized: title
        toon: title
        aliases: [role]
      - normalized: company
        toon: company
        transform: company_to_string
      - normalized: from
        toon: from
        aliases: [start, start_date]
      - normalized: to
        toon: to
        aliases: [end, end_date]
      - normalized: years
        toon: years
      - normalized: description
        toon: description
  - normalized: education
    toon: education
    transform: education_array
    item_map:
      - normalized: degree
        toon: degree
      - normalized: field
        toon: field
      - normalized: institution
        toon: institution
      - normalized: year
        toon: year
      - normalized: from
        toon: from
        aliases: [start]
      - normalized: gpa
        toon: gpa
  - normalized: certifications
    toon: certifications
    transform: certification_array_to_strings_or_objects
  - normalized: languages
    toon: languages
    transform: language_array_to_strings
  - normalized: total_experience_years
    toon: total_experience_years
    transform: number_optional

omitted_on_toon:
  - projects
  - person.current_location
  - person.city
  - person.address
  - person.preferred_location
  - experience.location
  - skill.canonical_id
  - metadata

required_toon_keys:
  root: [person, skills, experience, education]
  person: [name, email, phone]

typescript_gaps:
  - field: summary
    ts: required in ResumeTOON
    runtime: optional
  - field: languages
    ts: optional
    llm_prompt: not included

example: ../examples/resume/sample.toon
