# Dataset Factory — implementation roadmap

roadmap:
  id: DF-ROADMAP
  version: "1.0.0"
  updated_at: "2026-06-25"

phases:
  - id: M3.1
    name: Dataset Inspector (design)
    status: complete
    deliverables:
      - inspector/architecture.yaml
      - inspector/schemas/
      - inspector/templates/
      - inspector/quality_model.yaml
      - shared/stage_interface.yaml
      - pipeline.yaml
    constraints:
      - no_python_implementation
      - no_fake_statistics

  - id: M3.2
    name: Dataset Inspector (implementation)
    status: planned
    deliverables:
      - Python CLI in dataset_factory/inspector/
      - SHA-256 hash index generation
      - Format detection (magic bytes + extension)
      - Corrupt/password-protected file detection
      - Duplicate detection (hash + optional fuzzy)
      - Output artifact writers conforming to schemas/
    depends_on: [M3.1]

  - id: M3.3
    name: Extractor stage
    status: planned
    deliverables:
      - extractor/ implementation per interface.yaml
      - PDF, DOCX, DOC, TXT, RTF extractors
      - ZIP archive expansion (inspect inner files only)
    depends_on: [M3.2]

  - id: M4.1
    name: Validator stage
    status: planned
    deliverables:
      - Contract validation against ai/schemas/
      - Extraction quality gates
    depends_on: [M3.3]

  - id: M4.2
    name: Normalizer stage
    status: planned
    deliverables:
      - TOON-aligned normalization via ai/contracts/
      - Knowledge base linking
    depends_on: [M4.1]

  - id: M4.3
    name: Reviewer stage
    status: planned
    deliverables:
      - Review queue UI or CLI workflow
      - Approval sidecars on normalized records
    depends_on: [M4.2]

  - id: M4.4
    name: Exporter + Benchmark stages
    status: planned
    deliverables:
      - JSONL export with train/val/test splits
      - Frozen benchmark branch per BENCHMARK_STRATEGY.md
      - registry/datasets/ registration
    depends_on: [M4.3]

  - id: M5+
    name: Orchestration
    status: planned
    deliverables:
      - platform/orchestration/ DAG runner
      - Stage retry, caching, and lineage propagation
    depends_on: [M4.4]
