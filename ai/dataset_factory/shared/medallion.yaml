# Medallion architecture — Bronze / Silver / Gold dataset classification.
# Inspector assigns initial tier; downstream stages may promote.

medallion:
  id: DF-MEDALLION
  version: "1.0.0"
  status: active

tiers:
  bronze:
    label: Bronze
    description: >
      Raw, unprocessed source files. Immutable ingestion layer.
      Corresponds to datasets/raw/. Inspector operates exclusively on Bronze.
    promotion_criteria: null
    storage: datasets/raw/
    mutability: immutable
    typical_artifacts: [ART-RAW]

  silver:
    label: Silver
    description: >
      Extracted, cleaned, and validated text artifacts. Structured enough for
      normalization but not yet contract-aligned or human-reviewed.
    promotion_criteria:
      - extractor_complete
      - validator_pass_rate_gte: 0.95
    storage: [datasets/extracted/, datasets/cleaned/]
    mutability: versioned_overwrite_via_new_run
    typical_artifacts: [ART-EXTRACT, ART-CLEAN]

  gold:
    label: Gold
    description: >
      Normalized, schema-validated, and optionally human-reviewed records
      ready for JSONL export and training.
    promotion_criteria:
      - normalizer_complete
      - contract_validation_pass
      - reviewer_approved_or_auto_approved
    storage: [datasets/normalized/, datasets/jsonl/]
    mutability: versioned_immutable_releases
    typical_artifacts: [ART-NORM, ART-JSONL, ART-BENCH]

inspector_classification:
  field: dataset_profile.medallion.tier
  rule: >
    Inspector always classifies inspected corpus as bronze unless source_path
    points to a promoted snapshot (explicit override in run config).
  default: bronze

status_values:
  - pending_inspection
  - inspected
  - extraction_ready
  - extraction_in_progress
  - validated
  - normalized
  - review_pending
  - export_ready
  - benchmark_frozen
  - archived
