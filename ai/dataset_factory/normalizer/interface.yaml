# Normalizer stage — interface (not implemented)

stage:
  id: STAGE-NORMALIZER
  version: "1.0.0"
  status: interface_only
  implements: ../shared/stage_interface.yaml

description: >
  Map cleaned/extracted text to HR Intelligence Foundation contracts and
  TOON-aligned structured records in datasets/normalized/.

depends_on:
  - stage: STAGE-VALIDATOR
    gate: validation_summary.pass_rate gte 0.95

inputs:
  source_path: datasets/extracted/  # or datasets/cleaned/ when clean stage wired

outputs:
  path: datasets/normalized/{doc_type}/{document_id}.json
  artifact_type: NORMALIZED_RECORD

normalization_refs:
  contracts: ../../contracts/manifest.yaml
  schemas: ../../schemas/manifest.yaml
  toon_mapping: ../../schemas/mappings/toon.yaml
  knowledge: ../../knowledge/manifest.yaml

labeling_sources:
  - llm_assisted  # future; not HRMS parsing
  - rule_based
  - human_reviewed

implementation: deferred_M4.2
