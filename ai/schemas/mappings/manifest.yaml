# TOON mapping registry — HR Intelligence Foundation (M2)
# Documents how normalized schemas project to HRMS TOON (read-only reference).

mapping_registry:
  id: MAPPING-REGISTRY
  version: "1.0.0"
  status: active
  updated_at: "2026-06-25"

authority:
  toon_implementation: backend/toon.py
  toon_types: shared/types/toon.ts
  reverse_engineering_doc: docs/current_system/CURRENT_TOON_SCHEMA.md
  constraint: Do not modify TOON; consume mappings at normalization boundaries only.

mappings:
  - id: MAPPING-TOON
    file: toon.yaml
    documents:
      - schema: ../resume.yaml
        toon_type: resume
        required_toon_keys: [person, skills, experience, education]
      - schema: ../job_description.yaml
        toon_type: job_description
        required_toon_keys: [title, location, skills, responsibilities]
      - schema: ../candidate.yaml
        toon_type: null
        projection: primary_resume via resume mapping

projection_flow:
  - step: parse
    source: HRMS toon_loads / toon_loads_flex
    output: dict (TOON shape)
  - step: normalize
    source: contracts/ + knowledge/ alias lookup
    output: normalized schema instance
  - step: validate
    source: schemas/validation/rules.yaml
    output: validation report
  - step: project
    source: mappings/toon.yaml field_map + transforms
    output: TOON dict for toon_dumps

round_trip:
  rule: toon_dumps(toon_loads_flex(toon)) preserves semantics
  reference: docs/DATA_CONTRACTS.md
