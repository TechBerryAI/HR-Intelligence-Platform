# TOON projection mappings — HR Intelligence Foundation
# Maps normalized schemas to HRMS TOON dict shape (backend/toon.py).
# TOON source of truth: shared/types/toon.ts, backend/toon.py, CURRENT_TOON_SCHEMA.md
# Do NOT modify TOON implementation; consume these mappings at normalization boundaries.

mapping:
  id: MAPPING-TOON
  version: "1.0.0"
  status: active
  updated_at: "2026-06-25"

wire_format:
  implementation: backend/toon.py
  rules:
    - line_oriented: "key.path: value"
    - scalar_lists: pipe_delimited
    - object_arrays: zero_indexed_dot_paths
    - empty_arrays: "key[0]:"
    - null: omitted_on_serialize

resume:
  schema_ref: ../resume.yaml
  toon_type: resume
  type_field: resume

  field_map:
    - normalized: type
      toon: type
      transform: literal
    - normalized: person.name
      toon: person.name
      transform: string
    - normalized: person.email
      toon: person.email
      transform: string
    - normalized: person.phone
      toon: person.phone
      transform: string
    - normalized: person.location
      toon: person.location
      transform: location_to_string
    - normalized: person.linkedin
      toon: person.linkedin
      transform: string_optional
    - normalized: person.github
      toon: person.github
      transform: string_optional
    - normalized: person.portfolio
      toon: person.portfolio
      transform: string_optional
    - normalized: person.website
      toon: person.website
      transform: string_optional
    - normalized: person.twitter
      toon: person.twitter
      transform: string_optional
    - normalized: person.otherUrls
      toon: person.otherUrls
      transform: string_array
    - normalized: summary
      toon: summary
      transform: string_optional
    - normalized: skills
      toon: skills
      transform: skill_array_to_strings
    - normalized: experience
      toon: experience
      transform: experience_array
      item_map:
        - normalized: title
          toon: title
          aliases: [role]
        - normalized: company
          toon: company
          transform: company_to_string
        - normalized: from
          toon: from
          aliases: [start, start_date]
        - normalized: to
          toon: to
          aliases: [end, end_date]
        - normalized: years
          toon: years
        - normalized: description
          toon: description
    - normalized: education
      toon: education
      transform: education_array
      item_map:
        - normalized: degree
          toon: degree
        - normalized: field
          toon: field
        - normalized: institution
          toon: institution
        - normalized: year
          toon: year
        - normalized: from
          toon: from
          aliases: [start]
        - normalized: gpa
          toon: gpa
    - normalized: certifications
      toon: certifications
      transform: certification_array_to_strings_or_objects
    - normalized: languages
      toon: languages
      transform: language_array_to_strings
    - normalized: total_experience_years
      toon: total_experience_years
      transform: number_optional

  omitted_on_toon:
    - projects
    - person.current_location
    - person.city
    - person.address
    - person.preferred_location
    - experience.location
    - skill.canonical_id
    - metadata

  required_toon_keys:
    root: [person, skills, experience, education]
    person: [name, email, phone]

  typescript_gaps:
    - field: summary
      ts: required in ResumeTOON
      runtime: optional
    - field: languages
      ts: optional
      llm_prompt: not included

job_description:
  schema_ref: ../job_description.yaml
  toon_type: job_description
  type_field: job_description

  field_map:
    - normalized: type
      toon: type
      transform: literal
    - normalized: title
      toon: title
      transform: string
    - normalized: company
      toon: company
      transform: company_to_string_optional
    - normalized: location
      toon: location
      transform: location_to_string
    - normalized: employment_type
      toon: employment_type
      transform: string_optional
    - normalized: skills
      toon: skills
      transform: skill_array_to_strings
    - normalized: mandatory_skills
      toon: mandatory_skills
      transform: skill_array_to_strings
    - normalized: preferred_skills
      toon: preferred_skills
      transform: skill_array_to_strings
    - normalized: responsibilities
      toon: responsibilities
      transform: string_array
    - normalized: qualifications
      toon: qualifications
      transform: string_array_optional
    - normalized: keywords
      toon: keywords
      transform: string_array_optional
    - normalized: min_experience_years
      toon: min_experience_years
      transform: number_optional
    - normalized: max_experience_years
      toon: max_experience_years
      transform: number_optional
    - normalized: salary_range
      toon: salary_range
      transform: string_optional

  required_toon_keys:
    root: [title, location, skills, responsibilities]

  typescript_gaps:
    - field: mandatory_skills
      ts: not in JDTOON interface
      ats: used by ats_service.py
    - field: preferred_skills
      ts: not in JDTOON interface
      ats: used by ats_service.py
    - field: employment_type
      ts: required in interface
      runtime: not validated

candidate:
  schema_ref: ../candidate.yaml
  toon_type: null
  projection: none

  notes:
    - Candidate profile is not a TOON document class.
    - HRMS links via parsed_resumes.candidate_id optional FK.
    - For HRMS interchange, project primary_resume using resume mapping above.
    - preferences and application_history remain platform-local.

transforms:
  location_to_string:
    description: Emit location.raw or string passthrough; join city, region, country if structured.
  company_to_string:
    description: Emit company.name or string passthrough.
  skill_array_to_strings:
    description: Map skill.name or string; pipe-join on wire format via toon_dumps.
  certification_array_to_strings_or_objects:
    description: Prefer string[] for LLM compatibility; object[] accepted by frontend.
  experience_array:
    description: Zero-indexed object array in TOON paths experience.N.field.

round_trip:
  rule: toon_dumps(toon_loads_flex(toon)) preserves semantics
  flex_loader: backend/toon.py#toon_loads_flex
  legacy_json: accepted at storage boundary only
