# Reviewer stage — interface (not implemented)

stage:
  id: STAGE-REVIEWER
  version: "1.0.0"
  status: interface_only
  implements: ../shared/stage_interface.yaml

description: >
  Human-in-the-loop review queue for normalized records. Records approval,
  rejection, or correction without mutating source raw files.

depends_on:
  - stage: STAGE-NORMALIZER

inputs:
  source_path: dataset/lake/normalized/

outputs:
  sidecar_pattern: "{document_id}.review.yaml"
  artifact_type: REVIEW_DECISION
  queue: reviewer/queue/{dataset_id}/

decisions:
  - approved
  - rejected
  - corrected
  - escalated

config_schema:
  properties:
    auto_approve_confidence_gte: { type: number, default: 0.98 }
    require_dual_review: { type: boolean, default: false }
    sample_rate_for_review: { type: number, default: 0.10 }

implementation: deferred_M4.3
