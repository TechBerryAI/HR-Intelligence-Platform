name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          pip install -r apps/backend/requirements.txt
          pip install pytest
      - name: Run unit tests
        env:
          # Unit/mock only — no live Postgres or Ollama required
          DOCUMENT_INTELLIGENCE_VALIDATION_PAYLOAD: "true"
          FLASK_DEBUG: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
          ALLOW_INSECURE_JWT: "true"
        run: |
          pytest tests/backend/ \
            --ignore=tests/backend/test_jd_ollama_smoke.py \
            --ignore=tests/backend/test_resume_ollama_smoke.py \
            --ignore=tests/backend/test_platform_smoke.py \
            -q

  alembic-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hcip_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hcip_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r apps/backend/requirements.txt
      - name: Alembic upgrade head on empty DB
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hcip_ci
          FLASK_DEBUG: "true"
          ALLOW_INSECURE_JWT: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
        run: |
          alembic upgrade head
          alembic heads | grep -q 20260810_s001
          alembic current | grep -q 20260810_s001

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build

  ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AI runtime + test deps
        working-directory: ai
        run: |
          pip install -r requirements-runtime.txt
          pip install pytest
      - name: Run AI runtime unit tests (mocked providers)
        working-directory: ai
        run: pytest runtime/tests -q
