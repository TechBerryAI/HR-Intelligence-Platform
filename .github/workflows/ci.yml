name: CI

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hcip_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hcip_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system packages for document parsing
        run: sudo apt-get update && sudo apt-get install -y antiword
      - name: Install backend dependencies
        run: |
          pip install -r apps/backend/requirements.lock.txt
          pip install pytest pip-audit
      - name: Verify PyMuPDF, RapidOCR and antiword
        run: |
          python -c "import fitz, rapidocr_onnxruntime; print('PyMuPDF+RapidOCR OK')"
          python -c "import sys; sys.path.insert(0, 'apps/backend'); from app.ai.parser.text_extraction import antiword_available; assert antiword_available(), 'antiword missing'; print('antiword OK')"
      - name: Dependency audit (report-only)
        run: pip-audit -r apps/backend/requirements.lock.txt || true
      - name: Alembic upgrade head
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hcip_ci
          FLASK_DEBUG: "true"
          ALLOW_INSECURE_JWT: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
        run: alembic upgrade head
      - name: Run backend tests
        env:
          # Live Postgres required so create_app / route-matrix security tests execute
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hcip_ci
          DOCUMENT_INTELLIGENCE_VALIDATION_PAYLOAD: "true"
          FLASK_DEBUG: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
          ALLOW_INSECURE_JWT: "true"
          MAIL_SUPPRESS_SEND: "true"
        run: |
          pytest tests/backend/ \
            --ignore=tests/backend/test_jd_ollama_smoke.py \
            --ignore=tests/backend/test_resume_ollama_smoke.py \
            --ignore=tests/backend/test_platform_smoke.py \
            -q

  alembic-upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hcip_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hcip_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r apps/backend/requirements.lock.txt
      - name: Alembic upgrade head on empty DB
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hcip_ci
          FLASK_DEBUG: "true"
          ALLOW_INSECURE_JWT: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
        run: |
          alembic upgrade head
          test "$(alembic heads | awk '{print $1}')" = "$(alembic current | awk '{print $1}')"
          python - <<'PY'
          import os
          import psycopg
          url = os.environ["DATABASE_URL"]
          with psycopg.connect(url) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      SELECT column_name FROM information_schema.columns
                      WHERE table_schema = 'public' AND table_name = 'external_jobs'
                        AND column_name IN (
                          'leased_until', 'leased_by', 'pending_operation', 'next_attempt_at'
                        )
                      """
                  )
                  cols = {r[0] for r in cur.fetchall()}
                  expected = {
                      'leased_until', 'leased_by', 'pending_operation', 'next_attempt_at',
                  }
                  assert cols == expected, cols
                  cur.execute(
                      "SELECT 1 FROM pg_indexes WHERE indexname = 'ux_candidates_org_normalized_email'"
                  )
                  assert cur.fetchone(), 'missing ux_candidates_org_normalized_email'
                  cur.execute(
                      "SELECT 1 FROM pg_indexes WHERE indexname = 'ix_external_jobs_outbox_claim'"
                  )
                  assert cur.fetchone(), 'missing ix_external_jobs_outbox_claim'
                  cur.execute(
                      "SELECT 1 FROM information_schema.columns "
                      "WHERE table_name = 'bulk_parse_files' AND column_name = 'leased_until'"
                  )
                  assert cur.fetchone(), 'missing bulk_parse_files.leased_until'
          print('schema markers ok')
          PY

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth: .nvmrc, so CI and local dev cannot drift.
          node-version-file: .nvmrc
      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: apps/frontend
        run: npm run test
      - name: Dependency audit (report-only)
        working-directory: apps/frontend
        run: npm audit --audit-level=high || true
      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

  ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AI runtime + test deps
        working-directory: ai
        run: |
          pip install -r requirements-runtime.txt
          pip install pytest
      - name: Run AI runtime unit tests (mocked providers)
        working-directory: ai
        run: pytest runtime/tests -q
