name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          pip install -r apps/backend/requirements.txt
          pip install pytest
      - name: Verify PyMuPDF (PDF roundtrip tests)
        run: python -c "import fitz; print('PyMuPDF', fitz.version)"
      - name: Run unit tests
        env:
          # Unit/mock only — no live Postgres or Ollama required
          DOCUMENT_INTELLIGENCE_VALIDATION_PAYLOAD: "true"
          FLASK_DEBUG: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
          ALLOW_INSECURE_JWT: "true"
        run: |
          pytest tests/backend/ \
            --ignore=tests/backend/test_jd_ollama_smoke.py \
            --ignore=tests/backend/test_resume_ollama_smoke.py \
            --ignore=tests/backend/test_platform_smoke.py \
            -q

  alembic-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hcip_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hcip_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r apps/backend/requirements.txt
      - name: Alembic upgrade head on empty DB
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hcip_ci
          FLASK_DEBUG: "true"
          ALLOW_INSECURE_JWT: "true"
          JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
        run: |
          alembic upgrade head
          test "$(alembic heads | awk '{print $1}')" = "$(alembic current | awk '{print $1}')"
          python - <<'PY'
          import os
          import psycopg
          url = os.environ["DATABASE_URL"]
          with psycopg.connect(url) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      SELECT column_name FROM information_schema.columns
                      WHERE table_schema = 'public' AND table_name = 'external_jobs'
                        AND column_name IN (
                          'leased_until', 'leased_by', 'pending_operation', 'next_attempt_at'
                        )
                      """
                  )
                  cols = {r[0] for r in cur.fetchall()}
                  expected = {
                      'leased_until', 'leased_by', 'pending_operation', 'next_attempt_at',
                  }
                  assert cols == expected, cols
                  cur.execute(
                      "SELECT 1 FROM pg_indexes WHERE indexname = 'ux_candidates_org_normalized_email'"
                  )
                  assert cur.fetchone(), 'missing ux_candidates_org_normalized_email'
                  cur.execute(
                      "SELECT 1 FROM pg_indexes WHERE indexname = 'ix_external_jobs_outbox_claim'"
                  )
                  assert cur.fetchone(), 'missing ix_external_jobs_outbox_claim'
                  cur.execute(
                      "SELECT 1 FROM information_schema.columns "
                      "WHERE table_name = 'bulk_parse_files' AND column_name = 'leased_until'"
                  )
                  assert cur.fetchone(), 'missing bulk_parse_files.leased_until'
          print('schema markers ok')
          PY

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: apps/frontend
        run: |
          npm ci
          npm run build

  ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AI runtime + test deps
        working-directory: ai
        run: |
          pip install -r requirements-runtime.txt
          pip install pytest
      - name: Run AI runtime unit tests (mocked providers)
        working-directory: ai
        run: pytest runtime/tests -q
